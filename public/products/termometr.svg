<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="dialGradT" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="chromeBezelT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="thermShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Thermometer Brass/Steel Immersion Stem Tube at bottom -->
  <g id="stem">
    <rect x="238" y="380" width="24" height="100" fill="url(#stemGrad)" rx="3"/>
    <ellipse cx="250" cy="480" rx="12" ry="5" fill="#475569"/>
    <!-- Threaded connection bushing -->
    <rect x="230" y="380" width="40" height="22" fill="#ca8a04" stroke="#78350f" stroke-width="1.5" rx="2"/>
    <line x1="228" y1="387" x2="272" y2="387" stroke="#78350f" stroke-width="1.5"/>
    <line x1="228" y1="394" x2="272" y2="394" stroke="#78350f" stroke-width="1.5"/>
  </g>

  <!-- Gauge Body Outer Chrome Ring -->
  <circle cx="250" cy="220" r="185" fill="url(#chromeBezelT)" filter="url(#thermShadow)"/>
  <circle cx="250" cy="220" r="172" fill="#334155"/>
  <circle cx="250" cy="220" r="165" fill="url(#chromeBezelT)"/>
  
  <!-- Dial Face -->
  <circle cx="250" cy="220" r="156" fill="url(#dialGradT)" stroke="#0f172a" stroke-width="2"/>

  <!-- Temperature Scale Arc (0 - 120 °C or 0 - 160 °C) -->
  <path d="M 140 300 A 130 130 0 1 1 360 300" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Scale marks -->
  <!-- 0 °C -->
  <line x1="145" y1="295" x2="160" y2="282" stroke="#0284c7" stroke-width="3.5"/>
  <text x="168" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0284c7">0</text>
  
  <!-- 40 °C -->
  <line x1="140" y1="180" x2="160" y2="188" stroke="#0f172a" stroke-width="3"/>
  <text x="170" y="193" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">40</text>

  <!-- 80 °C (Top) -->
  <line x1="250" y1="95" x2="250" y2="115" stroke="#0f172a" stroke-width="3.5"/>
  <text x="240" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">80</text>

  <!-- 120 °C -->
  <line x1="360" y1="180" x2="340" y2="188" stroke="#ea580c" stroke-width="3"/>
  <text x="305" y="193" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ea580c">120</text>

  <!-- 160 °C -->
  <line x1="355" y1="295" x2="340" y2="282" stroke="#dc2626" stroke-width="3.5"/>
  <text x="300" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">160</text>

  <!-- Sub ticks -->
  <line x1="135" y1="235" x2="148" y2="235" stroke="#64748b" stroke-width="2"/>
  <line x1="165" y1="135" x2="175" y2="147" stroke="#64748b" stroke-width="2"/>
  <line x1="205" y1="102" x2="210" y2="117" stroke="#64748b" stroke-width="2"/>
  <line x1="295" y1="102" x2="290" y2="117" stroke="#64748b" stroke-width="2"/>
  <line x1="335" y1="135" x2="325" y2="147" stroke="#ea580c" stroke-width="2"/>
  <line x1="365" y1="235" x2="352" y2="235" stroke="#dc2626" stroke-width="2"/>

  <!-- Dial Labels -->
  <text x="250" y="170" font-family="Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#0284c7" letter-spacing="2">FLANKO</text>
  <text x="250" y="192" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">°C</text>
  <text x="250" y="270" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#475569">Биметаллический ТБП</text>

  <!-- Needle (pointing at ~55 °C) -->
  <g id="needleT" transform="rotate(-15 250 220)">
    <polygon points="247,240 253,240 251,90 249,90" fill="#dc2626"/>
    <polygon points="248,90 252,90 250,75" fill="#991b1b"/>
  </g>

  <!-- Center Pin/Cap -->
  <circle cx="250" cy="220" r="14" fill="url(#chromeBezelT)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="250" cy="220" r="6" fill="#1e293b"/>
  
  <!-- Glass Glare -->
  <path d="M 125 150 A 150 150 0 0 1 350 110 A 145 145 0 0 0 145 220 Z" fill="#ffffff" opacity="0.35"/>
</svg>

