<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="dialGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="chromeBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="metalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Brass Thread Bottom Connection -->
  <g id="connection">
    <rect x="230" y="380" width="40" height="90" fill="url(#brassGrad)" rx="3"/>
    <!-- Thread lines -->
    <line x1="228" y1="410" x2="272" y2="410" stroke="#78350f" stroke-width="2"/>
    <line x1="228" y1="422" x2="272" y2="422" stroke="#78350f" stroke-width="2"/>
    <line x1="228" y1="434" x2="272" y2="434" stroke="#78350f" stroke-width="2"/>
    <line x1="228" y1="446" x2="272" y2="446" stroke="#78350f" stroke-width="2"/>
    <line x1="228" y1="458" x2="272" y2="458" stroke="#78350f" stroke-width="2"/>
    <!-- Hex nut part -->
    <polygon points="220,380 280,380 274,398 226,398" fill="url(#brassGrad)" stroke="#78350f" stroke-width="1.5"/>
  </g>

  <!-- Gauge Body Outer Chrome Ring -->
  <circle cx="250" cy="220" r="185" fill="url(#chromeBezel)" filter="url(#metalShadow)"/>
  <circle cx="250" cy="220" r="172" fill="#334155"/>
  <circle cx="250" cy="220" r="165" fill="url(#chromeBezel)"/>
  
  <!-- Dial Face -->
  <circle cx="250" cy="220" r="156" fill="url(#dialGrad)" stroke="#0f172a" stroke-width="2"/>

  <!-- Dial Ticks & Scale -->
  <!-- 0 to 16 bar arc (from 140 deg to 40 deg, i.e. 260 deg arc) -->
  <path d="M 140 300 A 130 130 0 1 1 360 300" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Scale marks -->
  <!-- 0 bar -->
  <line x1="145" y1="295" x2="160" y2="282" stroke="#0f172a" stroke-width="3"/>
  <text x="170" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">0</text>
  
  <!-- 4 bar -->
  <line x1="140" y1="180" x2="160" y2="188" stroke="#0f172a" stroke-width="3"/>
  <text x="170" y="193" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">4</text>

  <!-- 8 bar (Top) -->
  <line x1="250" y1="95" x2="250" y2="115" stroke="#0f172a" stroke-width="3.5"/>
  <text x="245" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">8</text>

  <!-- 12 bar -->
  <line x1="360" y1="180" x2="340" y2="188" stroke="#dc2626" stroke-width="3"/>
  <text x="320" y="193" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">12</text>

  <!-- 16 bar (Red danger) -->
  <line x1="355" y1="295" x2="340" y2="282" stroke="#dc2626" stroke-width="3.5"/>
  <text x="315" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">16</text>

  <!-- Sub ticks -->
  <line x1="135" y1="235" x2="148" y2="235" stroke="#64748b" stroke-width="2"/>
  <line x1="165" y1="135" x2="175" y2="147" stroke="#64748b" stroke-width="2"/>
  <line x1="205" y1="102" x2="210" y2="117" stroke="#64748b" stroke-width="2"/>
  <line x1="295" y1="102" x2="290" y2="117" stroke="#64748b" stroke-width="2"/>
  <line x1="335" y1="135" x2="325" y2="147" stroke="#dc2626" stroke-width="2"/>
  <line x1="365" y1="235" x2="352" y2="235" stroke="#dc2626" stroke-width="2"/>

  <!-- Dial Labels -->
  <text x="250" y="170" font-family="Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#0284c7" letter-spacing="2">FLANKO</text>
  <text x="250" y="190" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">BAR / МПА</text>
  <text x="250" y="270" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#475569">Кл. 1.5 ГОСТ 2405</text>

  <!-- Needle (pointing at ~6 bar) -->
  <g id="needle" transform="rotate(-35 250 220)">
    <!-- Red needle pointer -->
    <polygon points="247,240 253,240 251,90 249,90" fill="#ef4444"/>
    <polygon points="248,90 252,90 250,75" fill="#b91c1c"/>
  </g>

  <!-- Center Pin/Cap -->
  <circle cx="250" cy="220" r="14" fill="url(#chromeBezel)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="250" cy="220" r="6" fill="#1e293b"/>
  
  <!-- Subtle Glass Glare -->
  <path d="M 125 150 A 150 150 0 0 1 350 110 A 145 145 0 0 0 145 220 Z" fill="#ffffff" opacity="0.35"/>
</svg>

